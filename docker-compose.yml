# Локальный PostgreSQL для будущей серверной части.
# Flutter-приложение напрямую к нему не ходит: с базой будет работать сервер.
services:
  postgres:
    image: postgres:17-alpine
    network_mode: host
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    volumes:
      - kanban_postgres_data:/var/lib/postgresql/data

volumes:
  kanban_postgres_data:
