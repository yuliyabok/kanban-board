# Зависимости Dart-сервера: HTTP routing, WebSocket и общий пакет контрактов.
name: kanban_server
description: Dart backend scaffold for the Kanban app.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.3

dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  dart_jsonwebtoken: ^3.4.1
  kanban_contracts:
    path: ../../packages/kanban_contracts
  postgres: ^3.5.11
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  uuid: ^4.5.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  http: ^1.6.0
  test: ^1.26.3
  very_good_analysis: ^10.2.0
