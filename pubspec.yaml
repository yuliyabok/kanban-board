name: kanban_board
description: Cross-platform offline-first Kanban board.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.9
  dio: ^5.9.2
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.3
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^10.2.0

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
